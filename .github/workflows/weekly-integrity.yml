name: weekly-integrity

on:
  schedule:
    # Sunday morning after the daily stability runs.
    - cron: '43 6 * * 0'
  workflow_dispatch:

concurrency:
  group: weekly-integrity-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  production-integrity:
    name: production integrity and R2 orphan media
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CF_R2_ACCOUNT_ID: ${{ secrets.CF_R2_ACCOUNT_ID }}
      CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
      CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
      CF_R2_BUCKET: ${{ secrets.CF_R2_BUCKET }}
      CF_R2_PUBLIC_URL: ${{ secrets.CF_R2_PUBLIC_URL }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      HEALTH_ALERT_EMAIL_TO: ${{ secrets.HEALTH_ALERT_EMAIL_TO }}
      HEALTH_ALERT_EMAIL_FROM: ${{ secrets.HEALTH_ALERT_EMAIL_FROM }}
      PROVIDER_COSTS_JSON: ${{ secrets.PROVIDER_COSTS_JSON }}
      PROVIDER_COSTS_FILE: ${{ secrets.PROVIDER_COSTS_FILE }}
      PROVIDER_BILLING_DIR: ${{ secrets.PROVIDER_BILLING_DIR }}
      PROVIDER_BILLING_SOURCES_JSON: ${{ secrets.PROVIDER_BILLING_SOURCES_JSON }}
      CLOUDFLARE_BILLING_URL: ${{ secrets.CLOUDFLARE_BILLING_URL }}
      CLOUDFLARE_BILLING_BEARER_TOKEN: ${{ secrets.CLOUDFLARE_BILLING_BEARER_TOKEN }}
      SUPABASE_BILLING_URL: ${{ secrets.SUPABASE_BILLING_URL }}
      SUPABASE_BILLING_BEARER_TOKEN: ${{ secrets.SUPABASE_BILLING_BEARER_TOKEN }}
      VERCEL_BILLING_URL: ${{ secrets.VERCEL_BILLING_URL }}
      VERCEL_BILLING_BEARER_TOKEN: ${{ secrets.VERCEL_BILLING_BEARER_TOKEN }}
      LIVEKIT_BILLING_URL: ${{ secrets.LIVEKIT_BILLING_URL }}
      LIVEKIT_BILLING_BEARER_TOKEN: ${{ secrets.LIVEKIT_BILLING_BEARER_TOKEN }}
      AI_BILLING_URL: ${{ secrets.AI_BILLING_URL }}
      AI_BILLING_BEARER_TOKEN: ${{ secrets.AI_BILLING_BEARER_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Check weekly production integrity
        id: integrity
        continue-on-error: true
        run: npm run integrity:weekly

      - name: Report weekly product health
        id: product
        continue-on-error: true
        run: npm run product:health

      - name: Check provider billing secret configuration
        id: provider_billing_secrets
        continue-on-error: true
        run: npm run cost:billing-secrets

      - name: Fetch provider billing exports
        if: ${{ env.PROVIDER_BILLING_SOURCES_JSON != '' || env.CLOUDFLARE_BILLING_URL != '' || env.SUPABASE_BILLING_URL != '' || env.VERCEL_BILLING_URL != '' || env.LIVEKIT_BILLING_URL != '' || env.AI_BILLING_URL != '' }}
        run: npm run cost:fetch-providers -- --github-env >> "$GITHUB_ENV"

      - name: Normalize provider billing exports
        if: ${{ env.PROVIDER_BILLING_DIR != '' }}
        run: npm run cost:collect-providers -- --dir "$PROVIDER_BILLING_DIR" --github-env >> "$GITHUB_ENV"

      - name: Check weekly cost health
        id: cost
        continue-on-error: true
        run: npm run cost:health

      - name: Check weekly moderation health
        id: moderation
        continue-on-error: true
        run: npm run moderation:health

      - name: Check weekly support health
        id: support
        continue-on-error: true
        run: npm run support:health

      - name: Check weekly campaign health
        id: campaigns
        continue-on-error: true
        run: npm run campaigns:health

      - name: Check weekly regional health
        id: regions
        continue-on-error: true
        run: npm run regions:health

      - name: Check weekly governance health
        id: governance
        continue-on-error: true
        run: npm run governance:health

      - name: Check weekly push and feed health
        id: push_feed
        continue-on-error: true
        run: npm run push-feed:health

      - name: Build weekly health dashboard
        id: dashboard
        continue-on-error: true
        run: npm run health:dashboard

      - name: Check feature freeze guard
        id: feature_freeze
        continue-on-error: true
        run: npm run feature:freeze

      - name: Open or update weekly health alert
        if: |
          steps.integrity.outcome == 'failure' ||
          steps.product.outcome == 'failure' ||
          steps.provider_billing_secrets.outcome == 'failure' ||
          steps.cost.outcome == 'failure' ||
          steps.moderation.outcome == 'failure' ||
          steps.support.outcome == 'failure' ||
          steps.campaigns.outcome == 'failure' ||
          steps.regions.outcome == 'failure' ||
          steps.governance.outcome == 'failure' ||
          steps.push_feed.outcome == 'failure' ||
          steps.dashboard.outcome == 'failure' ||
          steps.feature_freeze.outcome == 'failure'
        uses: actions/github-script@v8
        with:
          script: |
            const title = 'Weekly health guards failing';
            const labels = ['stability-alert'];
            const outcomes = {
              integrity: '${{ steps.integrity.outcome }}',
              product: '${{ steps.product.outcome }}',
              provider_billing_secrets: '${{ steps.provider_billing_secrets.outcome }}',
              cost: '${{ steps.cost.outcome }}',
              moderation: '${{ steps.moderation.outcome }}',
              support: '${{ steps.support.outcome }}',
              campaigns: '${{ steps.campaigns.outcome }}',
              regions: '${{ steps.regions.outcome }}',
              governance: '${{ steps.governance.outcome }}',
              push_feed: '${{ steps.push_feed.outcome }}',
              dashboard: '${{ steps.dashboard.outcome }}',
              feature_freeze: '${{ steps.feature_freeze.outcome }}',
            };
            const failed = Object.entries(outcomes)
              .filter(([, outcome]) => outcome === 'failure')
              .map(([name]) => name);
            const serverUrl = process.env.GITHUB_SERVER_URL || 'https://github.com';
            const runUrl = `${serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              'The weekly production health workflow found failing guards.',
              '',
              `Run: ${runUrl}`,
              `Branch: \`${context.ref}\``,
              `Commit: \`${context.sha}\``,
              '',
              '## Outcomes',
              '',
              ...Object.entries(outcomes).map(([name, outcome]) => `- ${name}: \`${outcome}\``),
              '',
              '## Required Response',
              '',
              '- Assign the owner from `docs/stability/ownership.json`.',
              '- Record the decision in `docs/stability/weekly-review.md`.',
              '- Keep broad feature launches frozen while stability, data lifecycle, release, moderation, or cost is red.',
            ].join('\n');
            const { owner, repo } = context.repo;
            try {
              await github.rest.issues.createLabel({
                owner,
                repo,
                name: labels[0],
                color: 'b60205',
                description: 'Automated stability and production health alert',
              });
            } catch (error) {
              if (error.status !== 422) throw error;
            }
            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              labels: labels.join(','),
              per_page: 100,
            });
            const issue = existing.find((candidate) => candidate.title === title);
            if (issue) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issue.number,
                body,
              });
              core.notice(`Updated existing alert issue #${issue.number}: ${failed.join(', ')}`);
            } else {
              const created = await github.rest.issues.create({
                owner,
                repo,
                title,
                body,
                labels,
              });
              core.notice(`Created alert issue #${created.data.number}: ${failed.join(', ')}`);
            }

      - name: Send Slack weekly health alert
        if: |
          env.SLACK_WEBHOOK_URL != '' &&
          (
            steps.integrity.outcome == 'failure' ||
            steps.product.outcome == 'failure' ||
            steps.provider_billing_secrets.outcome == 'failure' ||
            steps.cost.outcome == 'failure' ||
            steps.moderation.outcome == 'failure' ||
            steps.support.outcome == 'failure' ||
            steps.campaigns.outcome == 'failure' ||
            steps.regions.outcome == 'failure' ||
            steps.governance.outcome == 'failure' ||
            steps.push_feed.outcome == 'failure' ||
            steps.dashboard.outcome == 'failure' ||
            steps.feature_freeze.outcome == 'failure'
          )
        uses: actions/github-script@v8
        with:
          script: |
            const outcomes = {
              integrity: '${{ steps.integrity.outcome }}',
              product: '${{ steps.product.outcome }}',
              provider_billing_secrets: '${{ steps.provider_billing_secrets.outcome }}',
              cost: '${{ steps.cost.outcome }}',
              moderation: '${{ steps.moderation.outcome }}',
              support: '${{ steps.support.outcome }}',
              campaigns: '${{ steps.campaigns.outcome }}',
              regions: '${{ steps.regions.outcome }}',
              governance: '${{ steps.governance.outcome }}',
              push_feed: '${{ steps.push_feed.outcome }}',
              dashboard: '${{ steps.dashboard.outcome }}',
              feature_freeze: '${{ steps.feature_freeze.outcome }}',
            };
            const failed = Object.entries(outcomes)
              .filter(([, outcome]) => outcome === 'failure')
              .map(([name]) => name);
            const serverUrl = process.env.GITHUB_SERVER_URL || 'https://github.com';
            const runUrl = `${serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const text = [
              ':rotating_light: Weekly health guards failing',
              `Repo: ${context.repo.owner}/${context.repo.repo}`,
              `Run: ${runUrl}`,
              `Failed: ${failed.join(', ')}`,
              'Response: assign owner, update weekly review, keep affected broad feature rollout frozen.',
            ].join('\n');
            const response = await fetch(process.env.SLACK_WEBHOOK_URL, {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify({ text }),
            });
            if (!response.ok) {
              core.setFailed(`Slack alert failed: ${response.status} ${await response.text()}`);
            }

      - name: Send email weekly health alert
        if: |
          env.RESEND_API_KEY != '' &&
          env.HEALTH_ALERT_EMAIL_TO != '' &&
          env.HEALTH_ALERT_EMAIL_FROM != '' &&
          (
            steps.integrity.outcome == 'failure' ||
            steps.product.outcome == 'failure' ||
            steps.provider_billing_secrets.outcome == 'failure' ||
            steps.cost.outcome == 'failure' ||
            steps.moderation.outcome == 'failure' ||
            steps.support.outcome == 'failure' ||
            steps.campaigns.outcome == 'failure' ||
            steps.regions.outcome == 'failure' ||
            steps.governance.outcome == 'failure' ||
            steps.push_feed.outcome == 'failure' ||
            steps.dashboard.outcome == 'failure' ||
            steps.feature_freeze.outcome == 'failure'
          )
        uses: actions/github-script@v8
        with:
          script: |
            const outcomes = {
              integrity: '${{ steps.integrity.outcome }}',
              product: '${{ steps.product.outcome }}',
              provider_billing_secrets: '${{ steps.provider_billing_secrets.outcome }}',
              cost: '${{ steps.cost.outcome }}',
              moderation: '${{ steps.moderation.outcome }}',
              support: '${{ steps.support.outcome }}',
              campaigns: '${{ steps.campaigns.outcome }}',
              regions: '${{ steps.regions.outcome }}',
              governance: '${{ steps.governance.outcome }}',
              push_feed: '${{ steps.push_feed.outcome }}',
              dashboard: '${{ steps.dashboard.outcome }}',
              feature_freeze: '${{ steps.feature_freeze.outcome }}',
            };
            const failed = Object.entries(outcomes)
              .filter(([, outcome]) => outcome === 'failure')
              .map(([name]) => name);
            const serverUrl = process.env.GITHUB_SERVER_URL || 'https://github.com';
            const runUrl = `${serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const text = [
              'Weekly health guards are failing.',
              '',
              `Repo: ${context.repo.owner}/${context.repo.repo}`,
              `Run: ${runUrl}`,
              `Branch: ${context.ref}`,
              `Commit: ${context.sha}`,
              '',
              'Outcomes:',
              ...Object.entries(outcomes).map(([name, outcome]) => `- ${name}: ${outcome}`),
              '',
              'Required response:',
              '- Assign the owner from docs/stability/ownership.json.',
              '- Record the decision in docs/stability/weekly-review.md.',
              '- Keep affected broad feature rollout frozen until the guard is green or risk is accepted.',
            ].join('\n');
            const response = await fetch('https://api.resend.com/emails', {
              method: 'POST',
              headers: {
                authorization: `Bearer ${process.env.RESEND_API_KEY}`,
                'content-type': 'application/json',
              },
              body: JSON.stringify({
                from: process.env.HEALTH_ALERT_EMAIL_FROM,
                to: process.env.HEALTH_ALERT_EMAIL_TO.split(',').map((value) => value.trim()).filter(Boolean),
                subject: `Weekly health guards failing: ${failed.join(', ')}`,
                text,
              }),
            });
            if (!response.ok) {
              core.setFailed(`Email alert failed: ${response.status} ${await response.text()}`);
            }

      - name: Fail workflow when any guard failed
        if: |
          steps.integrity.outcome == 'failure' ||
          steps.product.outcome == 'failure' ||
          steps.provider_billing_secrets.outcome == 'failure' ||
          steps.cost.outcome == 'failure' ||
          steps.moderation.outcome == 'failure' ||
          steps.support.outcome == 'failure' ||
          steps.campaigns.outcome == 'failure' ||
          steps.regions.outcome == 'failure' ||
          steps.governance.outcome == 'failure' ||
          steps.push_feed.outcome == 'failure' ||
          steps.dashboard.outcome == 'failure' ||
          steps.feature_freeze.outcome == 'failure'
        run: |
          echo "One or more weekly health guards failed."
          exit 1
