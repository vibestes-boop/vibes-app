# -----------------------------------------------------------------------------
# Stability-Workflow: Production-Fruehwarnungen, die keine Secrets brauchen.
#
# Dieser Check ist bewusst klein und extern sichtbar: Er misst die echte
# Explore-Feed-API und die tatsaechlichen R2-Medien, damit Medien-Regressionen
# nicht erst durch Nutzer-Screenshots auffallen.
# -----------------------------------------------------------------------------

name: stability

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Zweimal taeglich: frueh genug fuer Drift, nicht noisy.
    - cron: '17 5,17 * * *'
  workflow_dispatch:

concurrency:
  group: stability-${{ github.ref }}
  cancel-in-progress: true

env:
  # Opt into GitHub's Node 24 JavaScript-action runtime before it becomes the
  # default, so scheduled production guardrails exercise the future runner path.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  route-smoke:
    name: route smoke (production)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Check public routes and legacy redirects
        run: node scripts/check-production-monitoring.mjs --skip-logs

  api-contract:
    name: public API contract (production)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Check Explore API contract
        run: node scripts/check-api-contracts.mjs --skip-supabase --require-cdn-cache --require-public-endpoint-cdn-cache

  media-budget:
    name: media budget (production)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Check Explore media budget
        run: node scripts/check-media-budget.mjs

  backend-integrity:
    name: backend integrity (production)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      # production_integrity_snapshot steht seit 20260814160000 nur service_role
      # offen — mit dem anon-Schluessel antwortet die Datenbank 401 und der
      # Waechter meldet Rot, ohne dass in der Produktion etwas kaputt waere.
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Check queue, cron, functions and media integrity
        run: npm run monitor:integrity

  authenticated-interactions:
    name: authenticated interactions (production)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      STABILITY_AUTH_EMAIL: ${{ secrets.STABILITY_AUTH_EMAIL }}
      STABILITY_AUTH_PASSWORD: ${{ secrets.STABILITY_AUTH_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install (root)
        run: npm ci --no-audit --no-fund

      - name: Check authenticated comments, likes and bookmarks
        run: npm run stability:auth -- --skip-if-missing

  # Telegram-Ping bei Rot (Security-/Monitoring-Ausbau 2026-07-02).
  # `if: failure()` + needs auf alle Jobs = feuert, sobald irgendein Job rot ist.
  # Ohne TELEGRAM_*-Secrets ist der Step ein No-Op (siehe Action-Doku).
  telegram-alert:
    name: telegram alert (bei rot)
    if: failure()
    needs: [route-smoke, api-contract, media-budget, backend-integrity, authenticated-interactions]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout (für lokale Action)
        uses: actions/checkout@v4
      - name: Telegram-Alarm senden
        uses: ./.github/actions/telegram-alert
        with:
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
          text: "🔴 stability (2x täglich) fehlgeschlagen auf ${{ github.ref_name }} — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
