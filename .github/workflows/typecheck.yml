# -----------------------------------------------------------------------------
# Typecheck-Workflow: tsc --noEmit gegen Expo-Root, apps/web und apps/berkat.
#
# ⚠️ JEDE App prüft sich mit IHREN Abhängigkeiten. Bis zum 24.08.2026 fehlte
# `apps/berkat` in der `exclude`-Liste der Wurzel-`tsconfig.json` — der
# Wurzel-Lauf zog Berkats Quelltext also mit hinein, während `npm ci` im
# Wurzelverzeichnis Berkats `node_modules` gar nicht anlegt. Ergebnis: zwei
# unlösbare `TS2307 Cannot find module`-Meldungen
# (`react-native-keyboard-controller`, `expo-image-manipulator`), obwohl beide
# Pakete in `apps/berkat/package.json` sauber deklariert sind.
#
# Das ist teurer als es aussieht: Ein dauerhaft roter Lauf schickt jedes Mal
# einen Telegram-Alarm, und nach dem dritten wischt man ihn weg. Dann fällt der
# nächste echte Fehler nicht mehr auf. Rot muss ein Signal bleiben.
#
# Zweck: TS-Sauberkeit gegen schleichende Regressionen schützen. Niemand läuft
# `tsc --noEmit` lokal manuell vor jedem Push — CI muss das übernehmen.
#
# Bewusst eigenes File (statt Step in test.yml): läuft parallel zu Jest, eigener
# Check-Eintrag in der PR-UI ("typecheck / web"), schneller-failing wenn TS
# broken ist (kein Warten auf Coverage-Run). Cache-Hit auf npm-Deps macht den
# zusätzlichen Install günstig.
#
# Trigger identisch zu test.yml — push+PR gegen main + workflow_dispatch für
# manuelle Reruns.
# -----------------------------------------------------------------------------

name: typecheck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: typecheck-${{ github.ref }}
  cancel-in-progress: true

env:
  # Opt into GitHub's Node 24 JavaScript-action runtime before it becomes the
  # default, so checkout/setup-node warnings turn into real compatibility tests.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  native:
    name: native (expo)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install (root)
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

  web:
    name: web (next.js)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install (apps/web)
        # npm ci nutzt lock + saubere node_modules. --no-audit/--no-fund für
        # weniger CI-Noise; Audits laufen bereits über Dependabot.
        run: npm ci --no-audit --no-fund

      - name: Type check
        # Script in apps/web/package.json:  "typecheck": "tsc --noEmit"
        # tsc beendet mit Exit 1 bei TS-Errors; npm run reicht den Exit-Code
        # 1:1 durch → Job rot, PR-Gate blockt.
        run: npm run typecheck

  berkat:
    name: berkat (expo)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: apps/berkat
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/berkat/package-lock.json

      - name: Install (apps/berkat)
        # Eigene Lock-Datei, eigene node_modules — genau deshalb gibt es diesen
        # Job. Der Wurzel-Lauf kann Berkat nicht prüfen, weil er dessen Pakete
        # nicht installiert (siehe Kopf dieser Datei).
        run: npm ci --no-audit --no-fund

      - name: Type check
        # Script in apps/berkat/package.json:  "typecheck": "tsc --noEmit"
        run: npm run typecheck

  # Telegram-Ping bei Rot (Security-/Monitoring-Ausbau 2026-07-02).
  # `if: failure()` + needs auf alle Jobs = feuert, sobald irgendein Job rot ist.
  # Ohne TELEGRAM_*-Secrets ist der Step ein No-Op (siehe Action-Doku).
  telegram-alert:
    name: telegram alert (bei rot)
    if: failure()
    needs: [native, web, berkat]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout (für lokale Action)
        uses: actions/checkout@v4
      - name: Telegram-Alarm senden
        uses: ./.github/actions/telegram-alert
        with:
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
          text: "🔴 typecheck fehlgeschlagen auf ${{ github.ref_name }} — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
